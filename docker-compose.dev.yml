name: ticketin_dev

networks:
  ticketin_dev:
    name: ticketin_dev

volumes:
  postgres_data_dev:
  redis_data_dev:

services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketin_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - ticketin_dev
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.0.8-alpine
    container_name: ticketin_redis_dev
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASS:-12345} --appendonly yes
    volumes:
      - redis_data_dev:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - ticketin_dev
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASS:-12345} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
