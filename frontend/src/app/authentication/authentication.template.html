<div class="container vh-100 d-flex justify-content-center align-items-center w-100">
  <div class="card">
    <div class="card-header">
      <div class="card-title">
        <h5 class="card-title">Login</h5>
        <h6 class="card-subtitle mb-2 text-body-secondary">Gestão de tickets</h6>
      </div>
    </div>
    <div class="card-body">
      <form [formGroup]="componentForm" (ngSubmit)="onFormSubmit()">
        <fieldset [disabled]="loadingStateSignal()">
          <div class="d-flex flex-column gap-3">
            <div class="form-group">
              <label class="text-dark fw-semibold" for="login:username">Usuário:</label>
              <input
                id="login:username"
                type="text"
                class="form-control"
                formControlName="username"
              />
            </div>
            <div class="form-group">
              <label class="text-dark fw-semibold" for="login:password">Senha:</label>
              <input
                id="login:password"
                type="password"
                class="form-control"
                formControlName="password"
              />
            </div>
            <button class="btn btn-outline-dark" type="submit" [disabled]="loadingStateSignal()">
              Acessar
            </button>
          </div>
        </fieldset>
      </form>
    </div>
  </div>
</div>
