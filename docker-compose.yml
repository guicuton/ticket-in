name: ticketin

networks:
  ticketin:
    name: ticketin

volumes:
  postgres_data:
  redis_data:

x-database-url: &database-url
  POSTGRES_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@ticketin_postgres:5432/${POSTGRES_DB:-app}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ticketin
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.0.8-alpine
    container_name: ticketin_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASS:-12345}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --save 300 100
    volumes:
      - redis_data:/data
    networks:
      - ticketin
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASS:-12345} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  migration:
    container_name: ticketin_migration
    build:
      context: .
      target: migrator
    command: ["npm", "run", "migration:deploy"]
    environment:
      <<: *database-url
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ticketin
    restart: "no"

  seed:
    container_name: ticketin_seed
    build:
      context: .
      target: migrator
    command: ["npm", "run", "migration:seed"]
    environment:
      <<: *database-url
      NODE_ENV: production
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - ticketin
    restart: "no"

  backend:
    container_name: ticketin_backend
    build:
      context: .
      target: backend
    environment:
      <<: *database-url
      NODE_ENV: production
      APP_PORT: 3000
      PM2_INSTANCES: ${PM2_INSTANCES:-2}
      REDIS_HOST: ticketin_redis
      REDIS_PORT: 6379
      REDIS_PASS: ${REDIS_PASS:-12345}
      JWT_SECRET: ${JWT_SECRET:-ABC1234}
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - ticketin
    restart: unless-stopped

  frontend:
    container_name: ticketin_frontend
    build:
      context: .
      target: frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - ticketin
    restart: unless-stopped
